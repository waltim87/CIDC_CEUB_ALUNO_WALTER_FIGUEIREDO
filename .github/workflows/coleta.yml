name: Coleta de dados abertos

on:
  schedule:
    # A cada 3 horas (UTC); o GitHub pode atrasar execuções agendadas em alguns minutos.
    - cron: "7 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Executar coleta
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANA_API_TOKEN: ${{ secrets.ANA_API_TOKEN }}
        run: python -m collectors.executar
      - name: Calcular indice e gerar rascunhos de alerta
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m core.automatico
      - name: Robo de analise de risco (IA gratuita ou modelo fixo)
        # A coleta já foi gravada nas etapas anteriores; uma falha aqui fica
        # vermelha de propósito, para não esconder problemas.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m core.robo
      - name: Relatorio PDF do robo
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m core.relatorio_robo
      - name: Anexar relatorio a execucao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-risco
          path: relatorios/*.pdf
          retention-days: 14
          if-no-files-found: ignore
