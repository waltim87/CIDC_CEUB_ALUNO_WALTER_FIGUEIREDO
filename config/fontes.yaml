ana:
  nome: ANA HidroWebService
  tipo: hidrologia
  periodicidade_min: 60
  status: ativo
  # Serviço público de telemetria da ANA (sem token). Verificado em 14/10/2026
  # com consultas reais às estações abaixo.
  endpoint: https://telemetriaws1.ana.gov.br/ServiceANA.asmx/DadosHidrometeorologicos
  documentacao_oficial: https://telemetriaws1.ana.gov.br/ServiceANA.asmx
  manuais_ana: https://www.gov.br/ana/pt-br/assuntos/monitoramento-e-eventos-criticos/monitoramento-hidrologico/orientacoes-manuais/manuais-de-sistemas-e-servicos-de-disponibilizacao-de-dados-hidrologicos
  formato: xml
  autenticacao:
    tipo: sem_autenticacao
  parametros:
    codEstacao: "{codigo_oficial}"
    dataInicio: "{data_inicio}"
    dataFim: "{data_fim}"
  janela_dias: 1
  # A telemetria devolve DataHora SEM fuso. INFERIDO empiricamente como horário
  # de Brasília (UTC-03:00): estações de AC, AM, RO e PA consultadas no mesmo
  # instante tinham a mesma última hora, e só UTC-03:00 resulta em atraso
  # plausível (~15-30 min). Confirmar com a ANA antes de uso operacional.
  fuso_horario_fonte: "-03:00"
  fuso_confirmacao: inferido_empiricamente
  # Unidades usuais da telemetria ANA: Nivel em cm, Vazao em m3/s, Chuva em mm.
  # Confirmar por estação no cadastro oficial.
  resposta:
    caminho_registros: ""
    campos:
      data_hora_leitura: DataHora
      nivel_cm: Nivel
      vazao: Vazao
      chuva_mm: Chuva
      tendencia: null
  # Estações de rio da ANA no AM que transmitiam nível em 14/10/2026
  # (scripts/inventario_estacoes_am.py) + Arumã-Jusante (piloto do Purus).
